<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomy & Physiology Part 2 Practice Exam</title>
  <style>
    :root {
        --primary: #0f172a;
        --accent: #2563eb;
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --correct-border: #16a34a;
        --correct-bg: #f0fdf4;
        --correct-text: #15803d;
        --wrong-border: #dc2626;
        --wrong-bg: #fef2f2;
        --wrong-text: #b91c1c;
        --partial-border: #d97706;
        --partial-bg: #fffbeb;
        --partial-text: #92400e;
        --border-color: #e2e8f0;
        --selected-border: #93c5fd;
        --selected-bg: #eff6ff;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        line-height: 1.5;
        padding-bottom: 60px;
    }

    header {
        position: -webkit-sticky;
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--primary);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        padding: 12px 16px;
    }

    .header-content {
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .header-title {
        min-width: 0;
    }

    .header-title h1 {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .header-title p {
        font-size: 0.75rem;
        color: #94a3b8;
    }

    .score-badge {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .nav-bar {
        max-width: 800px;
        margin: 16px auto 0;
        padding: 0 16px;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
    }

    .nav-bar::-webkit-scrollbar { display: none; }

    .filter-btn,
    .reset-btn {
        background: #ffffff;
        border: 1px solid var(--border-color);
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }

    .filter-btn:hover,
    .reset-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    .filter-btn.active {
        background: var(--accent);
        color: #ffffff;
        border-color: var(--accent);
    }

    main {
        max-width: 800px;
        margin: 16px auto;
        padding: 0 16px;
    }

    .q-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .q-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
    }

    .q-num {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .q-cat {
        font-size: 0.72rem;
        color: var(--text-muted);
        background: #f1f5f9;
        padding: 2px 8px;
        border-radius: 4px;
        white-space: nowrap;
    }

    .q-text {
        font-size: 0.98rem;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 16px;
        line-height: 1.45;
    }

    .opt-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .opt-btn {
        display: flex;
        align-items: flex-start;
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid var(--border-color);
        border-radius: 10px;
        background: #ffffff;
        color: var(--text-main);
        font-size: 0.92rem;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: border-color 0.15s ease, background-color 0.15s ease, opacity 0.15s ease;
    }

    .opt-btn:hover:not(:disabled) {
        border-color: #cbd5e1;
        background: #f8fafc;
    }

    .opt-btn:active:not(:disabled) { background-color: #f1f5f9; }

    .opt-prefix {
        font-weight: 700;
        margin-right: 8px;
        color: var(--text-muted);
        flex-shrink: 0;
    }

    .opt-btn.selected {
        border-color: var(--selected-border);
        background: var(--selected-bg);
        color: #1d4ed8;
    }

    .q-card.answered .opt-btn {
        cursor: default;
        pointer-events: none;
        opacity: 0.6;
    }

    .q-card.answered .opt-btn.user-correct,
    .q-card.answered .opt-btn.reveal-correct {
        background-color: var(--correct-bg) !important;
        border-color: var(--correct-border) !important;
        color: var(--correct-text) !important;
        opacity: 1 !important;
        font-weight: 600;
    }

    .q-card.answered .opt-btn.user-wrong {
        background-color: var(--wrong-bg) !important;
        border-color: var(--wrong-border) !important;
        color: var(--wrong-text) !important;
        opacity: 1 !important;
        font-weight: 600;
    }

    .submit-q-btn {
        margin-top: 14px;
        padding: 9px 14px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .submit-q-btn:hover:not(:disabled) { opacity: 0.92; }
    .submit-q-btn:active:not(:disabled) { transform: scale(0.98); }
    .submit-q-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .feedback-box {
        display: none;
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 0.88rem;
        line-height: 1.45;
    }

    .feedback-box.correct {
        background-color: var(--correct-bg);
        border-left: 4px solid var(--correct-border);
        color: var(--correct-text);
    }

    .feedback-box.incorrect {
        background-color: var(--wrong-bg);
        border-left: 4px solid var(--wrong-border);
        color: var(--wrong-text);
    }

    .feedback-box.partial {
        background-color: var(--partial-bg);
        border-left: 4px solid var(--partial-border);
        color: var(--partial-text);
    }

    .feedback-title { font-weight: 700; margin-bottom: 4px; }
    .explanation { margin-top: 4px; color: inherit; }

    @media (max-width: 640px) {
        header { padding: 10px 12px; }
        .header-title h1 { font-size: 1rem; }
        .header-title p { font-size: 0.7rem; }
        .score-badge { padding: 5px 10px; font-size: 0.8rem; }
        .nav-bar { padding: 0 12px; margin-top: 12px; }
        main { margin-top: 12px; padding: 0 12px; }
        .q-card { padding: 16px; }
        .q-text { font-size: 0.95rem; }
        .opt-btn { font-size: 0.9rem; padding: 11px 12px; }
    }
  </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="header-title">
                <h1>Anatomy and Physiology Part 2 Exam Practice</h1>
                <p id="header-subtitle">135 Questions</p>
            </div>
            <div class="score-badge" id="score-counter">
                Grade: 0%
            </div>
        </div>
    </header>

    <div class="nav-bar" id="navTabs">
        <button class="filter-btn active" data-lec="all" type="button">All (135)</button>
        <button class="filter-btn" data-lec="1" type="button">Lec 1: Muscular System (30)</button>
        <button class="filter-btn" data-lec="2" type="button">Lec 2: Nervous System P1 (30)</button>
        <button class="filter-btn" data-lec="3" type="button">Lec 3: Nervous System P2 (30)</button>
        <button class="filter-btn" data-lec="4" type="button">Lec 4: Respiratory &amp; Acid-Base (45)</button>
        <button class="reset-btn" id="resetBtn" type="button">Reset</button>
    </div>

    <main id="questionsContainer"></main>

    <script>
    const questionBank = [
      // ==========================================
      // LECTURE 1: MUSCULAR SYSTEM (30 Qs: 20 MCQ, 10 SATA)
      // ==========================================
      {
        lec: 1, type: "sata",
        text: "Which of the following represent major physiological functions of skeletal muscle tissue? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Generating heat as a byproduct of metabolic activity", correct: true },
          { text: "Maintaining posture and body position stability", correct: true },
          { text: "Producing body movements via traction on the skeleton", correct: true },
          { text: "Storing energy reserves in the form of glycogen", correct: true },
          { text: "Secreting respiratory mucus to humidify foreign particles", correct: false }
        ],
        explanation: "Skeletal muscle functions include heat generation, posture maintenance, body movement, protection, and glycogen storage. Mucus secretion is done by epithelial goblet cells."
      },
      {
        lec: 1, type: "sata",
        text: "Which histological features characterize cardiac muscle tissue under microscopic examination? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Presence of intercalated discs with gap junctions and desmosomes", correct: true },
          { text: "Branched cellular arrangement with single or double central nuclei", correct: true },
          { text: "Visible striations resulting from organized sarcomeres", correct: true },
          { text: "Involuntary functional control regulated by pacemaker cells", correct: true },
          { text: "Spindle-shaped cells completely lacking T-tubules", correct: false }
        ],
        explanation: "Cardiac muscle cells are striated, branched, involuntary, single/double nucleated, and joined by intercalated discs. Spindle-shaped cells describe smooth muscle."
      },
      {
        lec: 1, type: "sata",
        text: "Which connective tissue coverings of a skeletal muscle organ are correctly matched with their anatomical locations? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Epimysium surrounds the entire outer skeletal muscle organ", correct: true },
          { text: "Perimysium wraps around bundles of muscle fibers called fascicles", correct: true },
          { text: "Endomysium surrounds each individual skeletal muscle fiber (cell)", correct: true },
          { text: "Tendons are dense regular connective tissue continuations of these sheaths", correct: true },
          { text: "Endomysium directly covers the outer surface of bone periosteum", correct: false }
        ],
        explanation: "Epimysium wraps the whole muscle, perimysium wraps fascicles, and endomysium wraps individual cells. Tendons anchor epimysium/perimysium to bone."
      },
      {
        lec: 1, type: "sata",
        text: "Which microscopic components are present inside a single skeletal muscle fiber? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Sarcolemma acting as the plasma membrane of the muscle cell", correct: true },
          { text: "Sarcoplasmic reticulum storing and releasing calcium ions", correct: true },
          { text: "Transverse (T) tubules extending from the sarcolemma into the cell interior", correct: true },
          { text: "Myoglobin binding and storing oxygen within the sarcoplasm", correct: true },
          { text: "Intercalated discs joining adjacent fibers end-to-end", correct: false }
        ],
        explanation: "Skeletal muscle cells contain a sarcolemma, sarcoplasmic reticulum, T-tubules, and myoglobin. Intercalated discs exist only in cardiac muscle."
      },
      {
        lec: 1, type: "sata",
        text: "During the sliding filament mechanism of skeletal muscle contraction, which events occur within the sarcomere? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Myosin heads bind to exposed binding sites on actin filaments", correct: true },
          { text: "Thin filaments slide inward toward the M-line of the sarcomere", correct: true },
          { text: "The distance between adjacent Z-discs shortens", correct: true },
          { text: "The H-zone and I-band narrow during contraction", correct: true },
          { text: "Individual thick and thin protein filaments shorten in absolute physical length", correct: false }
        ],
        explanation: "Filaments do not shorten in length; they slide past each other, which pulls the Z-discs closer together and narrows the I-band and H-zone."
      },
      {
        lec: 1, type: "sata",
        text: "Which steps are necessary for a skeletal muscle fiber to relax after contraction? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Breakdown of acetylcholine (ACh) by acetylcholinesterase in the synaptic cleft", correct: true },
          { text: "Active pumping of calcium ions back into the sarcoplasmic reticulum", correct: true },
          { text: "Troponin-tropomyosin complex sliding back to cover myosin-binding sites on actin", correct: true },
          { text: "Cessation of action potentials along the motor neuron axon", correct: true },
          { text: "Detachment of epimysium from the underlying deep fascia", correct: false }
        ],
        explanation: "Relaxation requires clearing ACh, stopping action potentials, active reuptake of calcium into the SR (via ATP), and re-masking actin binding sites."
      },
      {
        lec: 1, type: "sata",
        text: "Which structural and physiological traits accurately describe smooth muscle tissue? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Spindle-shaped (fusiform) cells with a single central nucleus", correct: true },
          { text: "Non-striated appearance due to non-sarcomeric arrangement of myofilaments", correct: true },
          { text: "Involuntary contraction located in walls of blood vessels and visceral organs", correct: true },
          { text: "Slower contraction and relaxation speeds compared to skeletal muscle", correct: true },
          { text: "Dependence on T-tubule triads to release internal calcium stores", correct: false }
        ],
        explanation: "Smooth muscle cells are spindle-shaped, non-striated, involuntary, slow-contracting, and lack T-tubules."
      },
      {
        lec: 1, type: "sata",
        text: "Regarding ATP production and energy metabolism in skeletal muscle, which statements are true? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Creatine phosphate provides rapid ATP generation for short bursts (~15 seconds)", correct: true },
          { text: "Anaerobic glycolysis yields ATP rapidly without oxygen, producing lactic acid", correct: true },
          { text: "Aerobic respiration in mitochondria generates the majority of ATP during sustained exertion", correct: true },
          { text: "Myoglobin provides an intracellular oxygen reserve for mitochondrial respiration", correct: true },
          { text: "Skeletal muscle fibers store enough pre-formed ATP to fuel hours of continuous maximal contraction", correct: false }
        ],
        explanation: "Pre-stored ATP lasts only a few seconds; fibers must regenerate ATP via creatine phosphate, glycolysis, and aerobic respiration."
      },
      {
        lec: 1, type: "sata",
        text: "Which features correctly define a motor unit in skeletal muscle physiology? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Consists of a single somatic motor neuron and all the muscle fibers it innervates", correct: true },
          { text: "Small motor units (few fibers per nerve) control precise fine motor movements", correct: true },
          { text: "Large motor units (hundreds of fibers per nerve) generate powerful coarse contractions", correct: true },
          { text: "All muscle fibers within a single motor unit contract simultaneously when stimulated", correct: true },
          { text: "A single motor unit contains both cardiac and skeletal muscle fibers mixed together", correct: false }
        ],
        explanation: "A motor unit is one somatic motor neuron plus all muscle fibers it innervates. Fine movements have small motor units; large movements have big motor units."
      },
      {
        lec: 1, type: "sata",
        text: "Which structural events occur at the neuromuscular junction (NMJ) during excitation? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Voltage-gated calcium channels open in the axon terminal upon action potential arrival", correct: true },
          { text: "Acetylcholine (ACh) is released into the synaptic cleft via exocytosis", correct: true },
          { text: "ACh binds to ligand-gated ion channel receptors on the motor end plate", correct: true },
          { text: "Sodium ion influx into the sarcoplasm depolarizes the motor end plate membrane", correct: true },
          { text: "Potassium ions rush through T-tubules to directly synthesize troponin", correct: false }
        ],
        explanation: "Axon terminal Ca2+ entry triggers ACh exocytosis. ACh binds to motor end plate receptors, opening Na+ channels and depolarizing the sarcolemma."
      },
      {
        lec: 1, type: "mcq",
        text: "What is the specialized plasma membrane of a skeletal muscle fiber called?",
        options: [
          { text: "Sarcolemma", correct: true },
          { text: "Sarcoplasm", correct: false },
          { text: "Perimysium", correct: false },
          { text: "Epimysium", correct: false },
          { text: "Sarcoplasmic reticulum", correct: false }
        ],
        explanation: "The sarcolemma is the specific term for the plasma membrane enclosing a muscle fiber (cell)."
      },
      {
        lec: 1, type: "mcq",
        text: "What connective tissue layer directly surrounds individual skeletal muscle fibers?",
        options: [
          { text: "Endomysium", correct: true },
          { text: "Perimysium", correct: false },
          { text: "Epimysium", correct: false },
          { text: "Deep fascia", correct: false },
          { text: "Tendon sheath", correct: false }
        ],
        explanation: "Endomysium is the delicate connective tissue layer directly wrapping each individual muscle fiber."
      },
      {
        lec: 1, type: "mcq",
        text: "Which intracellular structure in skeletal muscle serves as the primary storage site for calcium ions?",
        options: [
          { text: "Sarcoplasmic reticulum", correct: true },
          { text: "Transverse (T) tubule", correct: false },
          { text: "Myofibril", correct: false },
          { text: "Sarcolemma", correct: false },
          { text: "Golgi apparatus", correct: false }
        ],
        explanation: "The sarcoplasmic reticulum is a modified smooth endoplasmic reticulum that stores and releases Ca2+."
      },
      {
        lec: 1, type: "mcq",
        text: "What role do Transverse (T) tubules play in skeletal muscle contraction physiology?",
        options: [
          { text: "They conduct action potentials deep into the interior of the muscle fiber", correct: true },
          { text: "They store glycogen molecules for ATP generation", correct: false },
          { text: "They anchor thick filaments to the M-line", correct: false },
          { text: "They secrete acetylcholinesterase into the synaptic cleft", correct: false },
          { text: "They synthesize myoglobin proteins", correct: false }
        ],
        explanation: "T-tubules are invaginations of the sarcolemma that carry muscle action potentials deep into the cell."
      },
      {
        lec: 1, type: "mcq",
        text: "Which protein blocks the myosin-binding sites on actin filaments in a resting skeletal muscle fiber?",
        options: [
          { text: "Tropomyosin", correct: true },
          { text: "Troponin", correct: false },
          { text: "Myosin", correct: false },
          { text: "Titin", correct: false },
          { text: "Dystrophin", correct: false }
        ],
        explanation: "In a resting muscle fiber, tropomyosin covers the active myosin-binding sites on the thin actin filament."
      },
      {
        lec: 1, type: "mcq",
        text: "What specific event occurs when calcium ions bind to troponin during muscle excitation-contraction coupling?",
        options: [
          { text: "Troponin changes shape and pulls tropomyosin away from actin binding sites", correct: true },
          { text: "Myosin heads immediately hydrolyze into titin and dystrophin", correct: false },
          { text: "Acetylcholine is actively transported back into presynaptic vesicles", correct: false },
          { text: "The sarcolemma repolarizes to resting potential (-70 mV)", correct: false },
          { text: "ATP is synthesized directly from lactic acid", correct: false }
        ],
        explanation: "Calcium binding to troponin causes a conformational shift that pulls tropomyosin off the myosin-binding sites on actin."
      },
      {
        lec: 1, type: "mcq",
        text: "What action causes the detachment of the myosin head from the actin filament during the crossbridge cycle?",
        options: [
          { text: "Binding of a new ATP molecule to the myosin head", correct: true },
          { text: "Hydrolysis of ATP into ADP and inorganic phosphate", correct: false },
          { text: "Release of calcium ions into the extracellular fluid", correct: false },
          { text: "Binding of acetylcholine to T-tubule receptors", correct: false },
          { text: "Opening of voltage-gated potassium channels", correct: false }
        ],
        explanation: "A new molecule of ATP must bind to the myosin head to cause crossbridge detachment from actin."
      },
      {
        lec: 1, type: "mcq",
        text: "Histologically, functional contractile units bounded by Z-discs within a myofibril are called:",
        options: [
          { text: "Sarcomeres", correct: true },
          { text: "Fascicles", correct: false },
          { text: "Myofilaments", correct: false },
          { text: "Crossbridges", correct: false },
          { text: "Triads", correct: false }
        ],
        explanation: "A sarcomere is the functional contractile unit of a striated muscle fiber, extending from one Z-disc to the next."
      },
      {
        lec: 1, type: "mcq",
        text: "Which neurotransmitter is released at the somatic neuromuscular junction to stimulate skeletal muscle fibers?",
        options: [
          { text: "Acetylcholine (ACh)", correct: true },
          { text: "Norepinephrine", correct: false },
          { text: "GABA", correct: false },
          { text: "Dopamine", correct: false },
          { text: "Glutamate", correct: false }
        ],
        explanation: "Somatic motor neurons release acetylcholine (ACh) at the neuromuscular junction."
      },
      {
        lec: 1, type: "mcq",
        text: "What enzyme breaks down acetylcholine in the synaptic cleft to prevent continuous muscle stimulation?",
        options: [
          { text: "Acetylcholinesterase", correct: true },
          { text: "Creatine kinase", correct: false },
          { text: "ATPase", correct: false },
          { text: "Carbonic anhydrase", correct: false },
          { text: "Myosin light-chain kinase", correct: false }
        ],
        explanation: "Acetylcholinesterase rapidly degrades ACh in the synaptic cleft, stopping end-plate excitation."
      },
      {
        lec: 1, type: "mcq",
        text: "Which muscle tissue type contains striated, multinucleated, long cylindrical cells under voluntary control?",
        options: [
          { text: "Skeletal muscle", correct: true },
          { text: "Cardiac muscle", correct: false },
          { text: "Smooth muscle", correct: false },
          { text: "Visceral muscle", correct: false },
          { text: "Autonomic muscle", correct: false }
        ],
        explanation: "Skeletal muscle consists of long, cylindrical, multinucleated, striated fibers subject to voluntary control."
      },
      {
        lec: 1, type: "mcq",
        text: "Which skeletal muscle organelle contains high concentrations of oxygen-storing red pigment?",
        options: [
          { text: "Myoglobin", correct: true },
          { text: "Hemoglobin", correct: false },
          { text: "Glycogen", correct: false },
          { text: "Calmodulin", correct: false },
          { text: "Creatine", correct: false }
        ],
        explanation: "Myoglobin is an oxygen-binding protein located in the sarcoplasm of muscle fibers."
      },
      {
        lec: 1, type: "mcq",
        text: "A connective tissue sheath that wraps around an entire bundle (fascicle) of 10 to 100 muscle fibers is the:",
        options: [
          { text: "Perimysium", correct: true },
          { text: "Epimysium", correct: false },
          { text: "Endomysium", correct: false },
          { text: "Sarcolemma", correct: false },
          { text: "Periosteum", correct: false }
        ],
        explanation: "Perimysium is the middle connective tissue layer surrounding a bundle of muscle fibers called a fascicle."
      },
      {
        lec: 1, type: "mcq",
        text: "What metabolic pathway provides the fastest immediate source of ATP for muscle contraction lasting under 15 seconds?",
        options: [
          { text: "Creatine phosphate transfer", correct: true },
          { text: "Aerobic cellular respiration", correct: false },
          { text: "Anaerobic glycolysis", correct: false },
          { text: "Beta oxidation of fatty acids", correct: false },
          { text: "Lactic acid fermentation", correct: false }
        ],
        explanation: "Creatine phosphate transfers its high-energy phosphate directly to ADP, supplying fast ATP for ~15 seconds."
      },
      {
        lec: 1, type: "mcq",
        text: "Which band or zone in a sarcomere contains only thin (actin) filaments and shrinks during contraction?",
        options: [
          { text: "I-band", correct: true },
          { text: "A-band", correct: false },
          { text: "H-zone", correct: false },
          { text: "M-line", correct: false },
          { text: "Z-disc", correct: false }
        ],
        explanation: "The I-band is the light region containing only thin filaments; it narrows as filaments slide during contraction."
      },
      {
        lec: 1, type: "mcq",
        text: "Which protein component forms the main structural backbone of thick filaments in sarcomeres?",
        options: [
          { text: "Myosin", correct: true },

      },
      {

      {

      {

      },
      {
        lec: 4, type: "mcq",
        text: "Vital Capacity (VC) is equal to the sum of which respiratory volumes?",

      },

      },
      {
        lec: 4, type: "mcq",
        text: "What serous membrane layer directly covers the outer surface of each lung?",
        options: [
          { text: "Visceral pleura", correct: true },

          { text: "Peritoneum", correct: false },

      },
      {
        lec: 4, type: "mcq",
        text: "What occurs during external respiration?",
        options: [

          { text: "Mitochondrial production of ATP using glucose", correct: false },
          { text: "Breakdown of glycogen into glucose inside skeletal muscle", correct: false },

        ],

      },
      {
        lec: 4, type: "mcq",
        text: "Which percentage of oxygen transported in arterial blood is dissolved directly in plasma?",
        options: [
          { text: "~1.5%", correct: true },

          { text: "~23%", correct: false },

        ],

      },
      {
        lec: 4, type: "mcq",
        text: "Which chemical condition describes blood pH dropping below 7.35?",
        options: [

          { text: "Homeostatic equilibrium", correct: false },
          { text: "Hypercapnia", correct: false },

        ],
        explanation: "Arterial blood pH below 7.35 is defined as acidosis."
      },
      {
        lec: 4, type: "mcq",
        text: "What chemical condition describes blood pH rising above 7.45?",
        options: [
          { text: "Alkalosis", correct: true },

          { text: "Hypocapnia", correct: false },
          { text: "Anoxia", correct: false },

        ],
        explanation: "Arterial blood pH above 7.45 is defined as alkalosis."
      },
      {
        lec: 4, type: "mcq",
        text: "What is the primary role of the carbonic acid-bicarbonate buffer system in blood plasma?",

      },
      {

      },

        ],

      },
      {
        lec: 4, type: "mcq",
        text: "What metabolic compensation occurs in response to prolonged metabolic acidosis?",
        options: [
          { text: "Hyperventilation to blow off excess CO2 and reduce blood acid levels", correct: true },
          { text: "Hypoventilation to trap CO2 and increase blood acid levels", correct: false },
          { text: "Decreased renal excretion of hydrogen ions", correct: false },
          { text: "Inhibition of carbonic anhydrase in erythrocytes", correct: false },
          { text: "Complete shutdown of central chemoreceptors", correct: false }
        ],
        explanation: "In metabolic acidosis, respiratory compensation triggers hyperventilation to exhale CO2 and raise pH toward normal."
      }
    ];

    let currentLec = "all";
    let shuffledQuestions = [];
    let activeQuestions = [];
    const userState = new Map();

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function buildShuffledQuestionSet() {
        const grouped = [];
        for (let lec = 1; lec <= 4; lec++) {
            const lectureQuestions = questionBank
                .map((q, index) => ({ ...q, qid: index }))
                .filter(q => q.lec === lec);
            grouped.push(...shuffleArray(lectureQuestions).map(q => ({
                ...q,
                options: shuffleArray(q.options)
            })));
        }
        shuffledQuestions = shuffleArray(grouped);
    }

    function setActiveQuestions(lec) {
        currentLec = lec;
        activeQuestions = lec === "all"
            ? [...shuffledQuestions]
            : shuffledQuestions.filter(q => q.lec === Number(lec));
    }

    function resetAttempt() {
        userState.clear();
        buildShuffledQuestionSet();
        setActiveQuestions(currentLec);
        renderQuestions();
        updateScore();
    }

    function filterQuestions(lec, button) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        setActiveQuestions(lec);
        renderQuestions();
        updateScore();
    }

    function updateScore() {
        let submittedCount = 0;
        let totalScore = 0;

        userState.forEach(state => {
            if (state.submitted) {
                submittedCount++;
                totalScore += state.score;
            }
        });

        const grade = submittedCount > 0
            ? Math.round((totalScore / submittedCount) * 100)
            : 0;

        const scoreElem = document.getElementById('score-counter');
        scoreElem.textContent = `Grade: ${grade}%`;
        scoreElem.title = `Answered ${submittedCount} / ${questionBank.length}`;
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D', 'E'];

        activeQuestions.forEach((q, displayIndex) => {
            const state = userState.get(q.qid) || { submitted: false, selected: [], score: 0 };
            const card = document.createElement('div');
            card.className = 'q-card';
            card.id = `qcard-${q.qid}`;

            if (state.submitted) {
                card.classList.add('answered');
                if (state.score === 1) card.classList.add('is-correct');
                else if (state.score > 0) card.classList.add('is-partial');
                else card.classList.add('is-wrong');
            }

            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                let extraClass = '';
                if (state.submitted) {
                    if (opt.correct && state.score === 1) extraClass = 'user-correct';
                    else if (opt.correct) extraClass = 'reveal-correct';
                    else if (state.selected.includes(optIndex)) extraClass = 'user-wrong';
                } else if (state.selected.includes(optIndex)) {
                    extraClass = 'selected';
                }

                optionsHTML += `
                    <button type="button" class="opt-btn ${extraClass}"
                            ${state.submitted ? 'disabled' : ''}
                            onclick="handleOptionClick(${q.qid}, ${optIndex})">
                        <span class="opt-prefix">${letters[optIndex]}.</span>
                        <span>${escapeHTML(opt.text)}</span>
                    </button>
                `;
            });

            const badge = q.type === 'sata' ? 'SATA' : 'MCQ';
            const submitDisabled = state.submitted || state.selected.length === 0 ? 'disabled' : '';
            const buttonText = state.submitted ? 'Submitted' : 'Submit Answer';

            card.innerHTML = `
                <div class="q-header">
                    <span class="q-num">Question ${displayIndex + 1}</span>
                    <span class="q-cat">${badge}</span>
                </div>
                <div class="q-text">${escapeHTML(q.text)}</div>
                <div class="opt-list">${optionsHTML}</div>
                <button class="submit-q-btn" id="btn_${q.qid}" ${submitDisabled}
                        onclick="submitAnswer(${q.qid})">${buttonText}</button>
                <div class="feedback-box" id="feedback_${q.qid}"></div>
            `;

            container.appendChild(card);
            if (state.submitted) showFeedback(q.qid);
        });
    }

    function handleOptionClick(qid, optIndex) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        if (!q) return;

        const existing = userState.get(qid) || { submitted: false, selected: [], score: 0 };
        if (existing.submitted) return;

        let selected;
        if (q.type === 'mcq') {
            selected = [optIndex];
        } else {
            selected = [...existing.selected];
            const index = selected.indexOf(optIndex);
            if (index >= 0) selected.splice(index, 1);
            else selected.push(optIndex);
        }

        userState.set(qid, { submitted: false, selected, score: 0 });
        renderQuestions();
    }

    function submitAnswer(qid) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        const state = userState.get(qid);
        if (!q || !state || state.selected.length === 0 || state.submitted) return;

        state.submitted = true;

        if (q.type === 'mcq') {
            state.score = q.options[state.selected[0]]?.correct ? 1 : 0;
        } else {
            const totalCorrect = q.options.filter(option => option.correct).length;
            let correctSelected = 0;
            let incorrectSelected = 0;

            state.selected.forEach(index => {
                if (q.options[index]?.correct) correctSelected++;
                else incorrectSelected++;
            });

            // NCLEX partial-credit scoring logic
            state.score = Math.min(1, Math.max(0, (correctSelected - incorrectSelected) / totalCorrect));
        }

        userState.set(qid, state);
        updateScore();
        renderQuestions();
    }

    function showFeedback(qid) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        const state = userState.get(qid);
        const fbBox = document.getElementById(`feedback_${qid}`);
        if (!q || !state || !fbBox) return;

        let statusClass = 'incorrect';
        let titleText = '✗ Incorrect';

        if (state.score === 1) {
            statusClass = 'correct';
            titleText = '✓ Correct!';
        } else if (state.score > 0) {
            statusClass = 'partial';
            titleText = `Partial Credit (+${state.score.toFixed(2)})`;
        }

        fbBox.className = `feedback-box ${statusClass}`;
        fbBox.style.display = 'block';
        fbBox.innerHTML = `
            <div class="feedback-title">${titleText}</div>
            <div class="explanation">${escapeHTML(q.explanation)}</div>
        `;
    }

    function escapeHTML(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    document.getElementById('navTabs').addEventListener('click', event => {
        const button = event.target.closest('.filter-btn');
        if (!button) return;
        filterQuestions(button.dataset.lec, button);
    });

    document.getElementById('resetBtn').addEventListener('click', resetAttempt);

    buildShuffledQuestionSet();
    setActiveQuestions('all');
    renderQuestions();
    updateScore();
    </script>
